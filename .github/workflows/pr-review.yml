name: PR Review with Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate PR diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > diff.txt
          echo "Diff generated in diff.txt"

      - name: Run AI review with fallback
        run: |
          cat > prompt.txt <<'EOF'
          You are reviewing a pull request diff before merge.
          Return ONLY plain text in this exact format:
          Overall Status: Pass or Needs Changes
          What Changed:
          - 2 to 4 short bullets
          Code Quality:
          - up to 4 short bullets
          Risks or Unknowns:
          - short bullets, or 'None'
          Next Actions:
          - up to 3 short bullets, or 'None'
          Keep output simple, clear, and non-technical where possible.
          EOF

          jq -Rs --arg instruction "$(cat prompt.txt)" \
            '{contents:[{parts:[{text:($instruction + "\n\nPR Diff:\n" + .)}]}]}' diff.txt > request.json

          provider=""

          # 1) Claude (primary)
          if [ -n "${CLAUDE_API_KEY}" ]; then
            jq -n --arg diff "$(cat diff.txt)" --arg instruction "$(jq -r '.contents[0].parts[0].text' request.json)" \
              '{
                model: "claude-3-5-sonnet-latest",
                max_tokens: 1200,
                messages: [
                  {role: "user", content: ($instruction + "\n\nPR Diff:\n" + $diff)}
                ]
              }' > claude_request.json

            claude_http=$(curl -sS -o claude_response.json -w "%{http_code}" -X POST \
              "https://api.anthropic.com/v1/messages" \
              -H "content-type: application/json" \
              -H "x-api-key: ${CLAUDE_API_KEY}" \
              -H "anthropic-version: 2023-06-01" \
              -d @claude_request.json)

            echo "Claude HTTP status: ${claude_http}"
            if [ "${claude_http}" = "200" ]; then
              jq -r '[.content[]? | select(.type=="text") | .text] | join("\n")' claude_response.json > review.txt
              if [ -s review.txt ]; then
                provider="Claude"
              fi
            fi
          else
            echo "CLAUDE_API_KEY not set, skipping Claude."
          fi

          # 2) Gemini (fallback)
          if [ -z "${provider}" ]; then
            if [ -n "${GEMINI_API_KEY}" ]; then
              gemini_http=$(curl -sS -o review.json -w "%{http_code}" -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -d @request.json)

              echo "Gemini HTTP status: ${gemini_http}"
              if [ "${gemini_http}" = "200" ] && ! jq -e 'has("error")' review.json >/dev/null 2>&1; then
                jq -r '.candidates[0].content.parts[0].text // empty' review.json > review.txt
                if [ -s review.txt ]; then
                  provider="Gemini"
                fi
              fi
            else
              echo "GEMINI_API_KEY not set, skipping Gemini."
            fi
          fi

          # 3) OpenAI (fallback)
          if [ -z "${provider}" ]; then
            if [ -n "${OPENAI_API_KEY}" ]; then
              jq -n --arg prompt "$(jq -r '.contents[0].parts[0].text' request.json)" \
                '{
                  model: "gpt-4.1-mini",
                  messages: [
                    {role: "system", content: "You are a PR reviewer. Keep output simple, clear, and concise."},
                    {role: "user", content: $prompt}
                  ],
                  temperature: 0.2
                }' > openai_request.json

              openai_http=$(curl -sS -o openai_response.json -w "%{http_code}" -X POST \
                "https://api.openai.com/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${OPENAI_API_KEY}" \
                -d @openai_request.json)

              echo "OpenAI HTTP status: ${openai_http}"
              if [ "${openai_http}" = "200" ]; then
                jq -r '.choices[0].message.content // empty' openai_response.json > review.txt
                if [ -s review.txt ]; then
                  provider="OpenAI"
                fi
              fi
            else
              echo "OPENAI_API_KEY not set, skipping OpenAI."
            fi
          fi

          if [ -z "${provider}" ]; then
            printf '%s\n' \
              "Overall Status: Needs Changes" \
              "What Changed:" \
              "- Unable to generate AI review from Claude, Gemini, or OpenAI." \
              "Code Quality:" \
              "- Review response was empty or invalid." \
              "Risks or Unknowns:" \
              "- AI review may be incomplete." \
              "Next Actions:" \
              "- Re-run workflow." \
              "- Verify CLAUDE_API_KEY, GEMINI_API_KEY, and OPENAI_API_KEY." > review.txt
            echo "::error::All AI providers failed or were unavailable."
            exit 1
          fi

          echo "Review provider used: ${provider}"
          echo "REVIEW_PROVIDER=${provider}" >> "$GITHUB_ENV"

      - name: Print Gemini review
        run: |
          echo "=== AI PR Review (${REVIEW_PROVIDER}) ==="
          cat review.txt
          echo ""
          echo "=== Workflow Summary ===" >> "$GITHUB_STEP_SUMMARY"
          echo "Provider: ${REVIEW_PROVIDER}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat review.txt >> "$GITHUB_STEP_SUMMARY"

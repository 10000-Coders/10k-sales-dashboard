name: PR Review with Gemini

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate PR diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > diff.txt
          echo "Diff generated in diff.txt"

      - name: Call Gemini API
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY is not set. Add it under repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          jq -Rs --arg instruction "You are reviewing a pull request diff before merge.
Return ONLY plain text in this exact format:
Overall Status: Pass or Needs Changes
What Changed:
- 2 to 4 short bullets
Code Quality:
- up to 4 short bullets
Risks or Unknowns:
- short bullets, or 'None'
Next Actions:
- up to 3 short bullets, or 'None'
Keep output simple, clear, and non-technical where possible." \
            '{contents:[{parts:[{text:($instruction + "\n\nPR Diff:\n" + .)}]}]}' diff.txt > request.json

          http_code=$(curl -sS -o review.json -w "%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json)

          echo "Gemini HTTP status: ${http_code}"
          if [ "${http_code}" != "200" ]; then
            echo "::error::Gemini request failed (HTTP ${http_code})"
            cat review.json
            exit 1
          fi

          if jq -e 'has("error")' review.json >/dev/null 2>&1; then
            echo "::error::Gemini returned an error in the response body"
            jq . review.json
            exit 1
          fi

          jq -r '.candidates[0].content.parts[0].text // empty' review.json > review.txt
          if [ ! -s review.txt ]; then
            printf '%s\n' \
              "Overall Status: Needs Changes" \
              "What Changed:" \
              "- Unable to parse AI review output." \
              "Code Quality:" \
              "- AI response was empty or invalid." \
              "Risks or Unknowns:" \
              "- Review may be incomplete." \
              "Next Actions:" \
              "- Re-run workflow." \
              "- Verify GEMINI_API_KEY and model access." > review.txt
          fi

      - name: Print Gemini review
        run: |
          echo "=== Gemini PR Review ==="
          cat review.txt
          echo ""
          echo "=== Workflow Summary ===" >> "$GITHUB_STEP_SUMMARY"
          cat review.txt >> "$GITHUB_STEP_SUMMARY"
